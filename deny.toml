# cargo-deny policy (brief §4: every third-party crate permissive). Run with `cargo xtask deny`;
# part of `cargo xtask ci`. Modelled on PdfCraft's policy (docs/structure-audit.md).
# Code dependencies follow the same rule as assets (AGENTS.md): permissive licences only.
# Copyleft (GPL, AGPL, LGPL) is never linked.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Shared Craft libraries; Cargo.toml pins the immutable revision.
allow-git = ["https://github.com/storytold/craft-libs"]

[advisories]
yanked = "warn"

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences that the
# siblings also accept for this one crate (they ship inside epaint, not in this repository).
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
