[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/notecraft", "apps/notecraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/notecraft"
# Not published to crates.io (path dependencies between workspace crates; cargo-deny treats
# path deps of publishable crates as wildcards).
publish = false

[workspace.dependencies]
# internal
notecraft-geom = { path = "crates/geom" }
notecraft-color = { path = "crates/color" }
notecraft-doc = { path = "crates/doc" }
notecraft-text = { path = "crates/text" }
notecraft-search = { path = "crates/search" }
notecraft-format = { path = "crates/format" }
notecraft-engine = { path = "crates/engine" }
notecraft-ui-egui = { path = "crates/ui-egui" }
notecraft-automation = { path = "crates/automation" }
notecraft-codecs = { path = "crates/codecs" }

# shared Craft libraries, pinned by immutable revision (structure-audit.md › Repository hygiene)
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# Local time for the hosts (apps only: the engine never reads the clock). Pure Rust; reads the
# system time zone itself.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
proptest = "1"
unicode-segmentation = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Pictures (crates/codecs only): pure-Rust decoders, no default features (no rayon, builds for wasm).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
