[workspace]
resolver = "3"
# `apps/*` joins the members with the first app (cargo rejects a glob that matches nothing).
members = ["crates/*", "xtask"]
default-members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/notecraft"

[workspace.dependencies]
# internal
notecraft-geom = { path = "crates/geom" }
notecraft-color = { path = "crates/color" }
notecraft-doc = { path = "crates/doc" }
notecraft-text = { path = "crates/text" }

# shared Craft libraries, pinned by immutable revision (structure-audit.md › Repository hygiene)
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
unicode-segmentation = "1"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
