[package]
name = "notecraft-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "NoteCraft L6 automation: the loopback control channel, the MCP server and the state inspection both share (every action is an engine command)"

[lints]
workspace = true

[dependencies]
notecraft-engine = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The control channel's random key. Already in the build (through the egui stack), at this
# version.
getrandom = "0.4"
